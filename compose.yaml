name: ai-testing-repos
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_lab_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ai_lab}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
