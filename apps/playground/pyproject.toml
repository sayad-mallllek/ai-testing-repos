[project]
name = "ai-app-playground"
version = "0.1.0"
description = "playground AI experiment"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ai-shared",
    "ddgs>=9,<10",
    "openai>=2,<3",
]

[tool.uv.sources]
ai-shared = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_playground"]
